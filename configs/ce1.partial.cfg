# CE1 | SR-1se FP5 | Dual-homed native IPv6 eBGP into 6PE core
# IPv6 /48 test loopback and /64 tagged client LAN advertised independently to both PEs.
configure {
    port 1/1/c1 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c2 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet { encap-type dot1q }
    }
    port 1/1/c3 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    router "Base" {
        autonomous-system 64501
        ecmp 2
        interface "to-pe1" {
            admin-state enable
            port 1/1/c1/1
            ipv6 { address 2001:db8:10::1 { prefix-length 126 } }
        }
        interface "to-pe2" {
            admin-state enable
            port 1/1/c3/1
            ipv6 { address 2001:db8:110::1 { prefix-length 126 } }
        }
        interface "client-vlan101" {
            admin-state enable
            port 1/1/c2/1:101
            ipv6 { address 2001:db8:101::1 { prefix-length 64 } }
        }
        interface "origin" {
            admin-state enable
            loopback
            ipv6 { address 2001:db8:100::1 { prefix-length 48 } }
        }
        bgp {
            admin-state enable
            router-id 192.0.2.101
            # Two learned routes with equal attributes may load-share on CE as well.
            multipath { family ipv6 { ebgp 2 } }
            group "EBGP-PE" {
                peer-as 64496
                family { ipv4 false ipv6 true }
                export { policy ["ORIGINATE-V6"] }
                import { policy ["REMOTE-V6-IN"] }
            }
            neighbor "2001:db8:10::2" { group "EBGP-PE" }
            neighbor "2001:db8:110::2" { group "EBGP-PE" }
        }
    }
    policy-options {
        prefix-list "MY-PREFIX" {
            prefix 2001:db8:100::/48 type exact { }
            prefix 2001:db8:101::/64 type exact { }
        }
        prefix-list "REMOTE-V6" {
            prefix 2001:db8:200::/48 type exact { }
            prefix 2001:db8:201::/64 type exact { }
        }
        policy-statement "ORIGINATE-V6" {
            entry 10 {
                from { prefix-list ["MY-PREFIX"] protocol { name [direct] } }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
        policy-statement "REMOTE-V6-IN" {
            entry 10 {
                from { prefix-list ["REMOTE-V6"] }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
    }
}
