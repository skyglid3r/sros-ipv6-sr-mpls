# P2 | SR-1se FP5 | P router, IS-IS + SR-MPLS only (NO BGP)
# ASN 64496 for PEs, CE1 AS 64501 / CE2 AS 64502.
configure {
    port 1/1/c1 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c2 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c3 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c4 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c4/1 {
        admin-state enable
    }
    router "Base" {
        
        interface "system" {
            admin-state enable
            ipv4 { primary { address 192.0.2.12 prefix-length 32 } }
            ipv6 { address 2001:db8:ffff::12 { prefix-length 128 } }
        }


        interface "to-pe1" {
            admin-state enable
            port 1/1/c1/1
            ipv4 { primary { address 10.0.12.2 prefix-length 30 } }
            ipv6 { address 2001:db8:12::2 { prefix-length 126 } }
        }
        interface "to-pe2" {
            admin-state enable
            port 1/1/c2/1
            ipv4 { primary { address 10.0.22.2 prefix-length 30 } }
            ipv6 { address 2001:db8:22::2 { prefix-length 126 } }
        }
        interface "to-pe3" {
            admin-state enable
            port 1/1/c3/1
            ipv4 { primary { address 10.0.32.1 prefix-length 30 } }
            ipv6 { address 2001:db8:32::1 { prefix-length 126 } }
        }
        interface "to-pe4" {
            admin-state enable
            port 1/1/c4/1
            ipv4 { primary { address 10.0.42.1 prefix-length 30 } }
            ipv6 { address 2001:db8:42::1 { prefix-length 126 } }
        }
        ecmp 2
        mpls-labels { sr-labels { start 20000 end 20099 } }
        isis 0 {
            admin-state enable
            level-capability 2
            area-address [49.0001]
            advertise-router-capability area
            traffic-engineering true
            ipv6-routing native
            level 2 { wide-metrics-only true }
            segment-routing {
                admin-state enable
                prefix-sid-range { global }
            }
            interface "system" { ipv4-node-sid { index 12 } }
            interface "to-pe1" { interface-type point-to-point }
            interface "to-pe2" { interface-type point-to-point }
            interface "to-pe3" { interface-type point-to-point }
            interface "to-pe4" { interface-type point-to-point }
        }

    }

}
