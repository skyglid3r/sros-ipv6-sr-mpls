# PE2 | SR-1se FP5 | 6PE BGP edge and SR-ISIS
# ASN 64496 for PEs, CE1 AS 64501 / CE2 AS 64502.
configure {
    port 1/1/c1 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c2 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c3 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    router "Base" {
        autonomous-system 64496
        interface "system" {
            admin-state enable
            ipv4 { primary { address 192.0.2.2 prefix-length 32 } }
            ipv6 { address 2001:db8:ffff::2 { prefix-length 128 } }
        }
        interface "local-v6" {
            admin-state enable
            loopback
            ipv6 { address 2001:db8:2::1 { prefix-length 48 } }
        }
        interface "to-ce" {
            admin-state enable
            port 1/1/c1/1
            ipv6 { address 2001:db8:110::2 { prefix-length 126 } }
        }
        interface "to-p1" {
            admin-state enable
            port 1/1/c2/1
            ipv4 { primary { address 10.0.21.1 prefix-length 30 } }
            ipv6 { address 2001:db8:21::1 { prefix-length 126 } }
        }
        interface "to-p2" {
            admin-state enable
            port 1/1/c3/1
            ipv4 { primary { address 10.0.22.1 prefix-length 30 } }
            ipv6 { address 2001:db8:22::1 { prefix-length 126 } }
        }
        ecmp 2
        mpls-labels { sr-labels { start 20000 end 20099 } }
        isis 0 {
            admin-state enable
            level-capability 2
            area-address [49.0001]
            advertise-router-capability area
            traffic-engineering true
            ipv6-routing native
            level 2 { wide-metrics-only true }
            segment-routing {
                admin-state enable
                prefix-sid-range { global }
            }
            interface "system" { ipv4-node-sid { index 2 } }
            interface "to-p1" { interface-type point-to-point }
            interface "to-p2" { interface-type point-to-point }
        }
        bgp {
            admin-state enable
            next-hop-resolution {
                labeled-routes {
                    transport-tunnel {
                        family label-ipv6 {
                            resolution filter
                            resolution-filter { ldp false sr-isis true }
                        }
                    }
                }
            }
            rib-management {
                ipv6 { route-table-import { policy-name "6PE-TO-IPV6" } }
                label-ipv6 { route-table-import { policy-name "V6-TO-LABEL-V6" } }
            }
            multipath { family label-ipv6 { ibgp 2 } }
            group "IBGP-6PE" {
                peer-as 64496
                local-address 192.0.2.2
                next-hop-self true
                family { ipv4 false ipv6 false label-ipv6 true }
                export { policy ["export-6pe"] }
            }
            neighbor "192.0.2.1" { group "IBGP-6PE" }
            neighbor "192.0.2.3" { group "IBGP-6PE" }
            neighbor "192.0.2.4" { group "IBGP-6PE" }
            group "EBGP-CE" {
                peer-as 64501
                family { ipv4 false ipv6 true }
                import { policy ["CE-IN"] }
                export { policy ["CE-OUT"] }
            }
            neighbor "2001:db8:110::1" { group "EBGP-CE" }
        }
    }
    policy-options {
        prefix-list "LOCAL-V6" {
            prefix 2001:db8:2::/48 type exact { }
        }
        prefix-list "EXTERNAL-V6" {
            prefix 2001:db8:100::/48 type exact { }
            prefix 2001:db8:101::/64 type exact { }
        }
        prefix-list "REMOTE-CE-V6" {
            prefix 2001:db8:200::/48 type exact { }
            prefix 2001:db8:201::/64 type exact { }
        }
        policy-statement "CE-IN" {
            entry 10 {
                from { prefix-list ["EXTERNAL-V6"] }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
        # Broad IPv6 -> Label-IPv6 import, identical to prior validated design.
        policy-statement "V6-TO-LABEL-V6" {
            entry 10 {
                from { protocol { name [bgp direct static] } }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
        # Only locally originated and locally CE-learned prefixes leave this PE.
        # This prevents a route received from another PE being turned into a new
        # advertised path, preserving the exactly two independent CE ingress PEs.
        policy-statement "export-6pe" {
            entry 10 {
                from { prefix-list ["LOCAL-V6"] protocol { name [direct] } }
                action { action-type accept }
            }
            entry 20 {
                from { prefix-list ["EXTERNAL-V6"] protocol { name [bgp] } }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
        # Separate reverse direction: Label-IPv6 -> ordinary IPv6 BGP RIB.
        policy-statement "6PE-TO-IPV6" {
            entry 10 {
                from { prefix-list ["REMOTE-CE-V6"] protocol { name [bgp-label] } }
                action { action-type accept }
            }
            entry 20 {
                from { protocol { name [direct static] } }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
        # Advertise remote client and CE loopback prefixes to the local CE.
        policy-statement "CE-OUT" {
            entry 10 {
                from { prefix-list ["REMOTE-CE-V6"] protocol { name [bgp-label] } }
                action { action-type accept }
            }
            default-action { action-type reject }
        }
    }
}
